name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check bash version
        run: bash --version | head -1

      - name: Check syntax
        run: bash -n codex-run && bash -n test/run-tests.sh

      # The macOS runner's default /bin/bash is 3.2, so this catches portability regressions.
      - name: Run scenarios
        run: ./test/run-tests.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax parsing (PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $errors = $null
          [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content -Raw codex-run.ps1), [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "Syntax OK"

      - name: Run scenarios
        shell: powershell
        run: .\test\run-tests.ps1
