name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: bash 버전 확인
        run: bash --version | head -1

      - name: 문법 검증
        run: bash -n codex-run && bash -n test/run-tests.sh

      # macOS 러너의 기본 /bin/bash 는 3.2 라 이식성 회귀를 여기서 잡는다
      - name: 시나리오 검증
        run: ./test/run-tests.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 구문 파싱 검증 (PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $errors = $null
          [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content -Raw codex-run.ps1), [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "구문 OK"

      - name: 시나리오 검증
        shell: powershell
        run: .\test\run-tests.ps1
